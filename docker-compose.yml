services:
  database:
    build:
      context: postgres
    container_name: matcha_database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matcha}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-matcha}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matcha_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-matcha}
      VERIFICATION_URL_BASE: ${VERIFICATION_URL_BASE:-http://localhost:5173/auth/verify}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/auth/reset-password}
      FT_REDIRECT_URI: ${VITE_FT_REDIRECT_URI:-http://localhost:5173/auth/callback/42}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app/backend
      - user_uploads_data:/app/backend/uploads
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "python -m database.migrate && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: matcha_frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_FT_CLIENT_ID: ${FT_CLIENT_ID:-ft_client_id}
      VITE_FT_REDIRECT_URI: ${VITE_FT_REDIRECT_URI:-http://localhost:5173/auth/callback/42}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
volumes:
  postgres_data:
  user_uploads_data: